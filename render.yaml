services:
  - type: web
    name: omniscient-watch
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HYPERBEAM_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: omniscient-watch-db
          property: connectionString

databases:
  - name: omniscient-watch-db
    plan: free
    region: oregon
    databaseName: omniscient_watch_db
    user: omniscient_watch_db_user
